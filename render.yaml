services:
  - type: web
    name: gridwise-optimizer
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: REQUEST_TIMEOUT_SECONDS
        value: 30.0
      - key: LLM_TIMEOUT_SECONDS
        value: 20.0
      - key: SOLVER_TIMEOUT_SECONDS
        value: 5.0
